name: Build, test and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the initial release after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formatting, tests and Clippy
        shell: bash
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build release executable and run independent oracles
        shell: bash
        run: |
          cargo build --release --locked --bin rpn
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tools/precision_oracle.py "target/release/rpn$suffix"
          python tools/transcendental_oracle.py "target/release/rpn$suffix"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python tools/keypad_console_smoke.py "target/release/rpn.exe"
          fi
          mkdir dist
          cp "target/release/rpn$suffix" "dist/rpn-$RUNNER_OS-$RUNNER_ARCH$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: rpn-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified binaries with SHA-256 checksums
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const version = fs.readFileSync('Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)[1];
            const tag = `v${version}`;
            const files = fs.readdirSync('dist').filter(name => name.startsWith('rpn-')).sort();
            if (files.length !== 3) throw new Error(`Expected three platform binaries; found ${files.length}`);
            const checksums = files.map(name => `${crypto.createHash('sha256').update(fs.readFileSync(path.join('dist', name))).digest('hex')}  ${name}`).join('\n') + '\n';
            fs.writeFileSync('dist/SHA256SUMS.txt', checksums);
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
              if (release.target_commitish !== context.sha) throw new Error('Existing release points to a different commit; refusing to replace it');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `rpning ${version}`, body: fs.readFileSync('docs/RELEASE_NOTES.md', 'utf8'),
                draft: false, prerelease: false
              })).data;
            }
            for (const name of [...files, 'SHA256SUMS.txt']) {
              if (release.assets.some(asset => asset.name === name)) continue;
              const data = fs.readFileSync(path.join('dist', name));
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
            core.info(`Published ${release.html_url}`);
